name: CI

on:
  push:
  pull_request:

# Least privilege: every job here only checks out and runs the test suites, so a
# read-only token is enough. Pinning it explicitly stops a fork PR's test code
# from inheriting a write-scoped token via an over-permissive repo/org default.
permissions:
  contents: read

jobs:
  python:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

  js:
    name: node:test + jsdom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # dom.test.mjs spawns make_report.py to render a real report for jsdom.
      - run: npm ci
      - run: npm test

  ci:
    name: CI
    if: always()
    needs: [python, js]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
